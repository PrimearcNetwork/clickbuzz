# Reference Nginx config for PRODUCTION (VPS). Compare with the live file
# before replacing anything:
#
#   sudo nginx -T | less                      # what's live now
#   diff -u /etc/nginx/sites-available/<live-file> deploy/nginx/clickbuz.conf
#
# Certificate paths below assume one Certbot certificate named clickbuz.in
# covering clickbuz.in, www.clickbuz.in, api.clickbuz.in, weekly.clickbuz.in
# and monthly.clickbuz.in — check
# `sudo certbot certificates` and adjust the paths if yours are split.
# After editing: sudo nginx -t && sudo systemctl reload nginx

# --- HTTP -> HTTPS (all hosts) ------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name clickbuz.in www.clickbuz.in api.clickbuz.in weekly.clickbuz.in monthly.clickbuz.in;

    # Certbot HTTP-01 renewals.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

# --- www -> apex ---------------------------------------------------------------
server {
    # nginx 1.24 syntax (the standalone `http2 on;` needs 1.25.1+).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.clickbuz.in;

    ssl_certificate     /etc/letsencrypt/live/clickbuz.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clickbuz.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://clickbuz.in$request_uri;
}

# --- Plan subdomains -> apex login with ?plan= --------------------------------
# weekly./monthly.clickbuz.in send visitors to the main site's login with the
# plan cycle added; the incoming query string (utm_*, click_id) is kept. The
# frontend stores the cycle (src/utils/planLock.js) and /plans then shows only
# that plan. 302 (not 301) so browsers don't cache the redirect for good.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name weekly.clickbuz.in;

    ssl_certificate     /etc/letsencrypt/live/clickbuz.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clickbuz.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    set $plan_args "";
    if ($args != "") { set $plan_args "&$args"; }
    return 302 https://clickbuz.in/login?plan=weekly$plan_args;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monthly.clickbuz.in;

    ssl_certificate     /etc/letsencrypt/live/clickbuz.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clickbuz.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    set $plan_args "";
    if ($args != "") { set $plan_args "&$args"; }
    return 302 https://clickbuz.in/login?plan=monthly$plan_args;
}

# --- Frontend: https://clickbuz.in -------------------------------------------
server {
    # nginx 1.24 syntax (the standalone `http2 on;` needs 1.25.1+).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clickbuz.in;

    ssl_certificate     /etc/letsencrypt/live/clickbuz.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clickbuz.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/clickbuzz/dist;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite emits content-hashed filenames — safe to cache forever. A missing
    # asset must 404 (not fall back to index.html), or a stale tab gets HTML
    # back for a JS chunk.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html (and SPA routes) must never be cached, or browsers keep
    # pointing at chunk hashes that the next deploy deletes.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}

# --- API: https://api.clickbuz.in -> Node on 127.0.0.1:5000 -------------------
upstream clickbuz_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    # nginx 1.24 syntax (the standalone `http2 on;` needs 1.25.1+).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.clickbuz.in;

    ssl_certificate     /etc/letsencrypt/live/clickbuz.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clickbuz.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Nginx's default is 1m — anything larger (posters/banners over 1 MB,
    # every movie/trailer) is rejected with 413 before reaching Node.
    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # backend/utils/analytics/ipHash.util.js prefers X-Real-IP (unspoofable).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Media uploads: backend streams straight to Bunny Storage, so Nginx must
    # stream too — no buffering the body to local disk first, and a body cap
    # matching MAX_UPLOAD_MB_MOVIE (20480 MB).
    location /api/upload {
        client_max_body_size 20g;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        client_body_timeout 3600s;
        proxy_pass http://clickbuz_backend;
    }

    location / {
        proxy_pass http://clickbuz_backend;
    }
}
